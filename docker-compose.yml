services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
